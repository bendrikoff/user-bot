name: Deploy

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Copy files to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          source: "bot.js,package.json,package-lock.json,ecosystem.config.js"
          target: ~/users-top-bot

      - name: Configure and restart on server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          script_stop: true
          script: |
            # Установка Node.js если отсутствует
            if ! command -v node &> /dev/null; then
              curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
              apt-get install -y nodejs
            fi
            
            # Установка PM2 если отсутствует
            if ! command -v pm2 &> /dev/null; then
              npm install -g pm2
            fi
            
            mkdir -p ~/users-top-bot
            cd ~/users-top-bot
            cat > .env << 'EOF'
            TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
            SUPABASE_URL=${{ secrets.SUPABASE_URL }}
            SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}
            WEB_APP_URL=${{ secrets.WEB_APP_URL }}
            API_PORT=3000
            EOF
            npm ci
            pm2 startOrReload ecosystem.config.js
            pm2 save
            pm2 startup | tail -n 1 | bash || true
